<!DOCTYPE html>
<html lang="en">

<head>
    <title>Question 4 - JavaScript</title>

</head>

<body>
    <h1>HTML DOM Events</h1>
    <p>Trigger a function on hover that will output "Hello World":</p>
    <!-- Issue: "onmouseover" event failed to trigger desired event when navigating with keyboard -->
    <!-- Fix: Added the event from "onfocus" -->

    <button onfocus="myFunction()" onmouseover="myFunction()">Action!</button>
    <p id="demo"></p>
</body>
<script>
    function myFunction() {
        document.getElementById("demo").innerHTML = "Hello World";
    }
</script>

</html>
