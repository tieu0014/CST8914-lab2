<!DOCTYPE html>
<html lang="en">

<head>
  <title>Question 3- CSS & HTML</title>
  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }
    /*Issue: Hover and active states were not defined for the button */
    .button:hover {
      background-color: #1b531e;
    }
    .button:active {
      background-color: #246428;
    }

    body {
      padding: 20px;
      background-color: #2f2f2f;
    }
    /*Issue: The text color was too dark, and therefore failed to pass the color contrast test against the background.
      Fix: Changed the text color to a lighter shade. */
    h1, h2, p {
      color: rgb(245, 241, 241);
    }
  </style>
</head>

<body>
  
  <h1>HTML made Easy</h1>

  <p>What causes errors in HTML?</p>
<!-- Issue: The button was classified as a div instead of a button -->
  <button class="button" type="button">Submit answers</button>

</body>

</html>
